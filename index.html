<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصر لايف</title>
<meta name="description" content="الإذاعات المصرية وقنوات التلفزيون المصري وأون سبورت في مكان واحد">
<meta name="theme-color" content="#0b3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f4ee,#0d1412);--card:light-dark(#fff,#16201d);--ink:light-dark(#14201c,#eef3f0);--mute:light-dark(#5b6a64,#9fb0a9);--line:light-dark(#e2ded3,#25322e);--green:#0b3d2e;--gold:#e8b23a;--red:#d8342c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) max(5vw,16px) 0}
.top{display:flex;align-items:center;gap:14px;max-width:1240px;margin:auto}
.logo{width:48px;height:48px;flex:none}
h1{margin:0;font-size:clamp(26px,4vw,36px);line-height:1.1;font-weight:800}
.sub{margin:2px 0 0;color:#cfe3da;font-size:14px}
.search{margin-inline-start:auto;width:min(320px,40vw)}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:999px;border:0;background:#ffffff1f;color:#fff}
.search input::placeholder{color:#cfe3da}
nav{display:flex;gap:6px;max-width:1240px;margin:18px auto 0;overflow-x:auto}
nav button{font:inherit;font-weight:600;border:0;background:none;color:#cfe3da;padding:10px 16px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{max-width:1240px;margin:auto;padding:22px max(5vw,16px)}
h2{font-size:20px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.note{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:12px 14px;color:var(--mute);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.st{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.st:hover{border-color:var(--gold)}
.st:focus-visible{outline:3px solid var(--gold)}
.st.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.st b{display:block;font-size:16px;line-height:1.3}
.st small{color:var(--mute);font-size:13px}
.fav{margin-inline-start:auto;background:none;border:0;font-size:20px;color:var(--mute);cursor:pointer;padding:6px}
.fav.y{color:var(--gold)}
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.links a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;text-decoration:none}
.links a b{display:block}
.links a small{color:var(--mute)}
#stage{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#stage.open{display:flex}
.frame{width:min(1000px,100%);background:#000;border-radius:14px;overflow:hidden}
.frame .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:#111}
.frame .bar a{color:var(--gold);font-size:14px;margin-inline-start:auto}
.frame .bar button{background:#333;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.ratio{aspect-ratio:16/9;width:100%}
.ratio iframe{width:100%;height:100%;border:0;display:block}
#player{position:fixed;inset-inline:0;bottom:0;background:var(--green);color:#fff;padding:12px max(5vw,16px) calc(12px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:12px;z-index:10}
#player.show{display:flex}
#player .badge{width:40px;height:40px}
#pl-name{font-weight:700}
#pl-state{font-size:13px;color:#cfe3da}
#player .ctl{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
#player button{width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:#14201c;font-size:18px;cursor:pointer}
#player input[type=range]{width:110px;accent-color:var(--gold)}
.empty{color:var(--mute)}
footer{color:var(--mute);font-size:13px;max-width:1240px;margin:20px auto;padding:0 max(5vw,16px)}
@media(max-width:600px){nav button{padding:10px 12px}.top{flex-wrap:wrap}.search{width:100%;order:3}#player input[type=range]{display:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#e8b23a"/><path d="M14 30a10 10 0 0 1 20 0" fill="none" stroke="#0b3d2e" stroke-width="3.5" stroke-linecap="round"/><path d="M8 30a16 16 0 0 1 32 0" fill="none" stroke="#0b3d2e" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="24" cy="31" r="4" fill="#d8342c"/></svg>
    <div><h1>مصر لايف</h1><p class="sub">إذاعات وقنوات مصرية، بث مباشر من المصادر الرسمية</p></div>
    <label class="search"><input id="q" type="search" placeholder="ابحث عن إذاعة أو قناة" aria-label="بحث"></label>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="radio" aria-selected="true">الإذاعات</button>
    <button role="tab" data-tab="tv" aria-selected="false">القنوات المصرية</button>
    <button role="tab" data-tab="sport" aria-selected="false">أون سبورت</button>
    <button role="tab" data-tab="fav" aria-selected="false">المفضلة ★</button>
  </nav>
</header>
<main id="main"></main>
<footer>كل الروابط من المواقع الرسمية للقنوات والإذاعات (ماسبيرو، ويوتيوب الرسمي للقناة، وخوادم البث المعلنة للإذاعات). لو رابط توقف، القناة نفسها غيّرته، وزر «افتح المصدر» يوديك للموقع الرسمي.</footer>

<div id="stage" role="dialog" aria-modal="true">
  <div class="frame">
    <div class="bar"><b id="st-name"></b><a id="st-src" target="_blank" rel="noopener">افتح المصدر ↗</a><button id="st-close">إغلاق ✕</button></div>
    <div class="ratio" id="st-box"></div>
  </div>
</div>

<div id="player">
  <div class="badge" id="pl-badge"></div>
  <div><div id="pl-name"></div><div id="pl-state"></div></div>
  <div class="ctl"><input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="الصوت"><button id="pp" aria-label="تشغيل/إيقاف">⏸</button><button id="stop" aria-label="إيقاف">■</button></div>
</div>
<audio id="audio" preload="none"></audio>

<script>
{
const DM = id => 'https://www.dailymotion.com/embed/video/' + id + '?autoplay=1';
const YT = id => 'https://www.youtube.com/embed/' + id + '?autoplay=1';
const MSP = n => 'https://www.maspero.eg/stream/' + n;

// type: audio = direct stream in the app player; embed = official video player
const DATA = {
  radio: [
    {g:'إذاعات ماسبيرو الرسمية', items:[
      {id:'r-quran',n:'إذاعة القرآن الكريم',d:'ماسبيرو',c:'#0b6b4a',type:'embed',url:DM('x84wyku'),src:MSP(7)},

      {id:'r-masr',n:'راديو مصر',d:'ماسبيرو',c:'#c0392b',type:'embed',url:DM('x8n6dpk'),src:MSP(8)},
      {id:'r-arab',n:'صوت العرب',d:'ماسبيرو',c:'#7a4b16',type:'embed',url:DM('x8n6dqq'),src:MSP(9)},
      {id:'r-youth',n:'الشباب والرياضة',d:'ماسبيرو',c:'#167a3e',type:'embed',url:DM('x8n6dzo'),src:MSP(11)},
      {id:'r-songs',n:'إذاعة الأغاني',d:'ماسبيرو',c:'#8e2c6b',type:'embed',url:DM('x8n6dyz'),src:MSP(13)},
      {id:'r-me',n:'الشرق الأوسط',d:'ماسبيرو',c:'#2c6e8e',type:'embed',url:DM('x8n6drt'),src:MSP(16)},
      {id:'r-cairo',n:'القاهرة الكبرى',d:'ماسبيرو',c:'#5a5a8e',type:'embed',url:DM('x8n6ebs'),src:MSP(14)},
      {id:'r-culture',n:'البرنامج الثقافي',d:'ماسبيرو',c:'#4d6b2c',type:'embed',url:DM('x8n6eci'),src:MSP(12)},
      {id:'r-euro',n:'البرنامج الأوروبي',d:'ماسبيرو',c:'#2c4d8e',type:'embed',url:DM('x8n6e6w'),src:MSP(18)},
      {id:'r-edu',n:'راديو التعليمية',d:'ماسبيرو',c:'#8e6b2c',type:'embed',url:DM('xakfzv2'),src:MSP(24)}
    ]},
    {g:'إذاعات FM الخاصة', items:[
      {id:'r-nogoum',n:'نجوم إف إم 100.6',d:'Nogoum FM',c:'#e4572e',type:'audio',url:'https://stream.zeno.fm/qb1zvsykm98uv',src:'https://www.nogoumfm.net/'},
      {id:'r-9090',n:'راديو 9090',d:'90.9 FM',c:'#d81b60',type:'audio',url:'https://9090streaming.mobtada.com/9090FMEGYPT',src:'https://www.9090.fm/'},
      {id:'r-mega',n:'ميجا إف إم 92.7',d:'Mega FM',c:'#f39c12',type:'audio',url:'https://megafm927.radioca.st/stream',src:'https://megafm927.com/'},
      {id:'r-nagham',n:'نغم إف إم 105.3',d:'Nagham FM',c:'#9b59b6',type:'audio',url:'https://ahmsamir.radioca.st/stream',src:'https://www.naghamfm1053.com/'},
      {id:'r-hits',n:'راديو هيتس 88.2',d:'Radio Hits',c:'#16a085',type:'audio',url:'https://radiohits882.radioca.st/;',src:'http://radiohits882.com/'},
      {id:'r-onfm',n:'أون سبورت إف إم',d:'ON Sport FM',c:'#c62828',type:'audio',url:'https://carina.streamerr.co:2020/stream/OnSportFM',src:'https://www.onsportfm.com/'}
    ]}
  ],
  tv: [
    {g:'قنوات ماسبيرو الرسمية', items:[
      {id:'t-1',n:'القناة الأولى',d:'ماسبيرو',c:'#1b4f8f',type:'embed',url:DM('x856hbh'),src:MSP(2)},
      {id:'t-2',n:'القناة الثانية',d:'ماسبيرو',c:'#c0392b',type:'embed',url:DM('x8n6dm7'),src:MSP(3)},
      {id:'t-sat',n:'الفضائية المصرية',d:'ماسبيرو',c:'#0b6b4a',type:'embed',url:DM('x8o63b6'),src:MSP(21)},
      {id:'t-sat-us',n:'الفضائية المصرية (أمريكا)',d:'ماسبيرو',c:'#0b5a6b',type:'embed',url:DM('x84nun4'),src:MSP(4)},
      {id:'t-news',n:'النيل للأخبار',d:'ماسبيرو',c:'#2c6e8e',type:'embed',url:DM('x84nwne'),src:MSP(1)},
      {id:'t-zaman',n:'ماسبيرو زمان',d:'ماسبيرو',c:'#7a4b16',type:'embed',url:DM('x8n6e4h'),src:MSP(6)},
      {id:'t-drama',n:'النيل للدراما',d:'ماسبيرو',c:'#8e2c6b',type:'embed',url:DM('x8n6e3a'),src:MSP(19)},
      {id:'t-cinema',n:'النيل سينما',d:'ماسبيرو',c:'#5a5a8e',type:'embed',url:DM('x8n6do7'),src:MSP(20)},
      {id:'t-niletv',n:'النيل الدولية',d:'Nile TV International',c:'#16a085',type:'embed',url:DM('x8lr1r8'),src:MSP(5)}
    ]},
    {g:'قنوات خاصة (يوتيوب الرسمي)', items:[
      {id:'t-qahera',n:'القاهرة الإخبارية',d:'AlQahera News',c:'#b71c1c',type:'embed',url:YT('GtBCVKHHz7E'),src:'https://www.youtube.com/channel/UCktyejXTxWaKfrgp1Oq7CMQ/live'},
      {id:'t-nas',n:'القاهرة والناس',d:'Al Kahera Wal Nas',c:'#e67e22',type:'embed',url:YT('ENOR_-SUZkA'),src:'https://www.youtube.com/channel/UCzWdc0aUo0IDk5ysLrt04hw/live'}
    ]}
    ,{g:'شبكة الجزيرة (يوتيوب الرسمي)', items:[
      {id:'t-aj',n:'الجزيرة',d:'Al Jazeera Arabic',c:'#c8961e',type:'embed',url:YT('FelGGahCbS8'),src:'https://www.youtube.com/channel/UCfiwzLy-8yKzIbsmZTzxDgw/live'},
      {id:'t-ajnow',n:'الجزيرة الآن',d:'Al Jazeera Arabic',c:'#a87a12',type:'embed',url:YT('bNyUyrR0PHo'),src:'https://www.youtube.com/channel/UCfiwzLy-8yKzIbsmZTzxDgw/live'},
      {id:'t-ajm',n:'الجزيرة مباشر',d:'Al Jazeera Mubasher',c:'#d35400',type:'embed',url:YT('N8xxOD0nT1Y'),src:'https://www.youtube.com/channel/UCfiwzLy-8yKzIbsmZTzxDgw/live'},
      {id:'t-ajd',n:'الجزيرة الوثائقية',d:'Al Jazeera Documentary',c:'#2e7d32',type:'embed',url:YT('TiPYdMXt_XI'),src:'https://www.youtube.com/channel/UC0LSnqrwqtMwl2YwfUpO66g/live'},
      {id:'t-aje',n:'الجزيرة الإنجليزية',d:'Al Jazeera English',c:'#8d6e00',type:'embed',url:YT('gCNeDWCI0vo'),src:'https://www.youtube.com/channel/UCNye-wNBqNL5ZzHSJj3l8Bg/live'},
      {id:'t-ajb',n:'الجزيرة البلقان',d:'Al Jazeera Balkans',c:'#455a64',type:'embed',url:'https://www.youtube.com/embed/live_stream?channel=UC_yXEx3-Gk5drg9qhPzSQSg&autoplay=1',src:'https://www.youtube.com/channel/UC_yXEx3-Gk5drg9qhPzSQSg/live'}
    ]}
  ],
  sport: [
    {g:'تشغيل مباشر', items:[
      {id:'s-onfm',n:'أون سبورت إف إم',d:'الراديو الرسمي، بث مباشر',c:'#c62828',type:'audio',url:'https://carina.streamerr.co:2020/stream/OnSportFM',src:'https://www.onsportfm.com/'}
    ]}
  ]
};
const SPORT_NOTE = 'قنوات أون سبورت (أون تايم سبورت سابقًا) مالهاش بث مجاني رسمي على الإنترنت، والمباريات بتتعرض أونلاين عن طريق تطبيق WATCH IT باشتراك. علشان كده مش هنستخدم روابط مسروقة؛ هنا الراديو الرسمي يشتغل مباشر، والباقي روابط للمصادر الرسمية.';
const SPORT_LINKS = [
  {n:'WATCH IT',d:'البث الرسمي لقنوات أون سبورت (باشتراك)',u:'https://www.watchit.com/'},
  {n:'قناة أون سبورت على يوتيوب',d:'ملخصات وأهداف وبرامج',u:'https://www.youtube.com/@ONSporteg'},
  {n:'أون سبورت إف إم على يوتيوب',d:'برامج الراديو بالفيديو',u:'https://www.youtube.com/@ONsportFM'}
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs = new Set(store.get('favs', []));
let tab = store.get('tab', 'radio');
let current = null;
let offline = new Set();
const ALL = Object.values(DATA).flat().flatMap(g => g.items);
const byId = id => ALL.find(x => x.id === id);
const initials = n => { const w = n.replace(/^(إذاعة|راديو|القناة|البرنامج)\s+/, '').trim().split(/\s+/)[0].replace(/^ال(?=..)/, ''); return w.slice(0, 2); };

function card(s){
  return `<div class="st${current&&current.id===s.id?' on':''}" role="button" tabindex="0" data-id="${s.id}">
    <span class="badge" style="background:${s.c}">${esc(initials(s.n))}</span>
    <span><b>${esc(s.n)}</b><small>${esc(s.d)} · ${s.type==='audio'?'صوت':'المشغل الرسمي'}${offline.has(s.id)?' · <span style="color:var(--red)">متوقف الآن</span>':''}</small></span>
    <button class="fav${favs.has(s.id)?' y':''}" data-fav="${s.id}" aria-label="مفضلة">${favs.has(s.id)?'★':'☆'}</button></div>`;
}
function render(){
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const q = $('#q').value.trim();
  const match = s => !q || (s.n + s.d).includes(q) || (s.n + s.d).toLowerCase().includes(q.toLowerCase());
  let html = '';
  if (q) {
    const r = ALL.filter((s,i,a) => match(s) && a.findIndex(x=>x.id===s.id)===i);
    html = r.length ? `<h2>نتائج البحث</h2><div class="grid">${r.map(card).join('')}</div>` : '<p class="empty">مفيش نتائج.</p>';
  } else if (tab === 'fav') {
    const r = [...favs].map(byId).filter(Boolean);
    html = r.length ? `<h2>المفضلة</h2><div class="grid">${r.map(card).join('')}</div>` : '<p class="empty">اضغط ☆ على أي إذاعة أو قناة علشان تظهر هنا.</p>';
  } else {
    if (tab === 'sport') html += `<p class="note">${SPORT_NOTE}</p>`;
    html += DATA[tab].map(g => `<h2>${g.g}</h2><div class="grid">${g.items.map(card).join('')}</div>`).join('');
    if (tab === 'sport') html += `<h2>المصادر الرسمية</h2><div class="links">${SPORT_LINKS.map(l=>`<a href="${l.u}" target="_blank" rel="noopener"><b>${l.n} ↗</b><small>${l.d}</small></a>`).join('')}</div>`;
    if (tab === 'radio') html = '<p class="note">إذاعات ماسبيرو بتشتغل من مشغل ماسبيرو الرسمي (ممكن يظهر إعلان قصير في الأول). الإذاعات الخاصة بتشتغل صوت بس في المشغل اللي تحت.</p>' + html;
  }
  $('#main').innerHTML = html;
}

const audio = $('#audio');
function playAudio(s){
  closeStage();
  current = s;
  audio.src = s.url; audio.volume = +$('#vol').value;
  $('#pl-name').textContent = s.n; $('#pl-badge').textContent = initials(s.n); $('#pl-badge').style.background = s.c;
  $('#pl-state').textContent = 'جاري التحميل…'; $('#player').classList.add('show');
  audio.play().catch(() => { $('#pl-state').textContent = 'اضغط ▶ للتشغيل'; $('#pp').textContent = '▶'; });
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: s.n, artist: 'مصر لايف'});
  render();
}
function stopAudio(){ audio.pause(); audio.removeAttribute('src'); audio.load(); $('#player').classList.remove('show'); current = null; render(); }
audio.addEventListener('playing', () => { $('#pl-state').textContent = 'بث مباشر'; $('#pp').textContent = '⏸'; });
audio.addEventListener('pause', () => { $('#pp').textContent = '▶'; });
audio.addEventListener('waiting', () => { $('#pl-state').textContent = 'جاري التحميل…'; });
audio.addEventListener('error', () => { if (current) $('#pl-state').innerHTML = 'البث مش متاح دلوقتي · <a style="color:#e8b23a" target="_blank" rel="noopener" href="' + current.src + '">افتح الموقع الرسمي</a>'; });
$('#pp').onclick = () => audio.paused ? audio.play().catch(()=>{}) : audio.pause();
$('#stop').onclick = stopAudio;
$('#vol').oninput = e => audio.volume = +e.target.value;

function openStage(s){
  if (current) stopAudio();
  $('#st-name').textContent = s.n; $('#st-src').href = s.src;
  $('#st-box').innerHTML = `<iframe src="${s.url}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  $('#stage').classList.add('open');
}
function closeStage(){ $('#stage').classList.remove('open'); $('#st-box').innerHTML = ''; }
$('#st-close').onclick = closeStage;
$('#stage').onclick = e => { if (e.target.id === 'stage') closeStage(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStage(); });

function activate(el){
  const s = byId(el.dataset.id); if (!s) return;
  s.type === 'audio' ? playAudio(s) : openStage(s);
}
$('#main').addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f) { e.stopPropagation(); const id = f.dataset.fav; favs.has(id) ? favs.delete(id) : favs.add(id); store.set('favs', [...favs]); render(); return; }
  const c = e.target.closest('.st'); if (c) activate(c);
});
$('#main').addEventListener('keydown', e => { const c = e.target.closest('.st'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); activate(c); } });
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; store.set('tab', tab); $('#q').value=''; render(); });
$('#q').oninput = render;
render();
// live status from Dailymotion's public API (Maspero streams)
{
  const dmItems = ALL.filter(x => x.url.includes('dailymotion.com'));
  const ids = [...new Set(dmItems.map(x => x.url.split('/video/')[1].split('?')[0]))];
  fetch('https://api.dailymotion.com/videos?fields=id,onair&limit=100&ids=' + ids.join(','))
    .then(r => r.json()).then(j => {
      const off = new Set((j.list || []).filter(v => !v.onair).map(v => v.id));
      dmItems.forEach(x => { if (off.has(x.url.split('/video/')[1].split('?')[0])) offline.add(x.id); });
      render();
    }).catch(() => {});
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
