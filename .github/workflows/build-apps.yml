name: Build apps

on:
  push:
    branches: [main]
    paths: ['android/**', 'desktop/**', '.github/workflows/build-apps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk MasrLive.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: MasrLive.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/MasrLive-Setup.exe }

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مصر لايف 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            - **MasrLive-Setup.exe**: ملف التثبيت للكمبيوتر (ويندوز).
            - **MasrLive.apk**: ملف التثبيت للموبايل (أندرويد).
          files: |
            MasrLive.apk
            MasrLive-Setup.exe
